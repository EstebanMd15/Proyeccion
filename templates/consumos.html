{% extends "base.html" %}
{% block title %}Consumos · Motor de Compras{% endblock %}
{% block nav_cons %}activo{% endblock %}
{% block content %}
<h1>Consumos</h1>
<div class="card">
    <div id="msg-consumos" class="aviso" style="display:none"></div>
    <label>Rotación</label>
    <select id="rot_tipo">
        <option value="dispensacion">Dispensación</option>
        <option value="remisiones">Remisiones</option>
    </select>
    <label>Desde</label>
    <select id="rot_desde"></select>
    <label>Hasta</label>
    <select id="rot_hasta"></select>
    <p class="hint" id="hint-periodos">Cargando periodos disponibles</p>

    <div class="row-botones">
        <button type="button" onclick="descargarRotacion()">Descargar rotación</button>
    </div>
    <div class="overlay" id="overlay">
        <div class="spinner"></div>
        <p>Generando archivo...</p>
    </div>
</div>
<script>

const MESES = {'01':'Ene', '02':'Feb', '03':'Mar', '04':'Abr', '05':'May', '06':'Jun',
               '07':'Jul', '08':'Ago', '09':'Sep', '10':'Oct', '11':'Nov', '12':'Dic'};

let PERIODOS = {dispensacion: [], remisiones: []};

// al abrir: trae periodos y MUESTRA los rangos cargados en el hint
fetch('/rotacion/periodos').then(r => r.json()).then(p => {
    PERIODOS = p;
    poblarPorTipo(document.getElementById('rot_tipo').value);
}).catch(() => {
    document.getElementById('hint-periodos').textContent = 'No se pudieron cargar los períodos disponibles.';
});

function poblarPorTipo(tipo){
    const periodos = (PERIODOS[tipo] || []).map(x => x.replace('-', '_')).sort();
    llenarSelect(document.getElementById('rot_desde'), periodos, periodos[0]);
    llenarSelect(document.getElementById('rot_hasta'), periodos, periodos[periodos.length - 1]);
    const nombre = (tipo === 'remisiones') ? 'Remisiones' : 'Dispensación';
    document.getElementById('hint-periodos').textContent = periodos.length ? `${nombre}: ${etiquetaPeriodo(periodos[0])} a
    ${etiquetaPeriodo(periodos[periodos.length - 1])}` : 'Sin periodos disponibles para esta rotación.';
}

// Al cambiar la rotación repoblar los meses
document.getElementById('rot_tipo').addEventListener('change', e => poblarPorTipo(e.target.value));

function etiquetaPeriodo(p){
    const s = p.replace("-","_");
    return MESES[s.slice(-2)] + ' ' + s.slice(0,4);
}

function llenarSelect(sel, periodos, seleccion){
    sel.innerHTML = '';
    periodos.forEach(p => {
        const o = document.createElement('option');
        o.value = p.replace('-','_');
        o.textContent = etiquetaPeriodo(p);
        sel.appendChild(o);
    });
    if (seleccion) sel.value = seleccion;
}

function mostrarMsg(texto){
    const box = document.getElementById('msg-consumos');
    box.textContent = texto;
    box.style.display = 'block';
    box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function mesesEnRango(dv, hv){                       // 'YYYY-MM' -> ['YYYY_MM', ...]
    const [ay, am] = dv.split('_').map(Number);
    const [by, bm] = hv.split('_').map(Number);
    const out = []; let y = ay, m = am;
    while (y < by || (y === by && m <= bm)){
        out.push(`${y}_${String(m).padStart(2,'0')}`);
        if (++m > 12){ m = 1; y++; }
    }
    return out;
}

async function descargarRotacion(tipo){
    document.getElementById('msg-consumos').style.display = 'none';   // limpia mensaje previo
    const dv = document.getElementById('rot_desde').value;
    const hv = document.getElementById('rot_hasta').value;
    if(!dv || !hv){ mostrarMsg('Elige el rango de meses (desde / hasta).'); return; }
    if(dv > hv){ mostrarMsg('El "Desde" no puede ser mayor que el "Hasta".'); return; }

    const overlay = document.getElementById('overlay');
    overlay.style.display = 'flex';
    try {
        const resp = await fetch(`/rotacion/${tipo}?desde=${dv}&hasta=${hv}`);
        if(!resp.ok) throw new Error('fallo');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `Rotacion_${tipo}.xlsx`;
        a.click(); URL.revokeObjectURL(url);
    } catch(e){
        mostrarMsg('Hubo un error al generar el archivo.');
    } finally {
        overlay.style.display = 'none';
    }
}
</script>
{% endblock %}
