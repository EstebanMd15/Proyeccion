<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %} Motor Inteligencia de Negocios{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
    <nav class="topbar">
        <a href="/" class="brand">MOTOR INTELIGENCIA DE NEGOCIOS</a>
    <div class="modulos">
        {% if seccion == 'compras' %}
            <a href="/proyeccion" class="modulo {% block nav_proy %}{% endblock %}">PROYECCIÓN</a>
            <a href="/consumos" class="modulo {% block nav_cons %}{% endblock %}">CONSUMOS</a>
        {% elif seccion == 'inventarios' %}
            <a href="/abastecimiento" class="modulo {% block nav_abast %}{% endblock %}">ABASTECIMIENTO</a>
            <a href="/reparto" class="modulo {% block nav_reparto %}{% endblock %}">REPARTO</a>
        <!--{% elif seccion == 'calidad' %}
            <a href="/calidad/registro" class="modulo {% block nav_calidad %}{% endblock %}">REGISTRO</a>
            <a href="/calidad/dashboard" class="modulo {% block nav_dashboard %}{% endblock %}">DASHBOARD</a>
            <a href="/calidad/equipos" class="modulo {% block nav_equipos %}{% endblock %}">EQUIPOS</a>-->
        {% else %}
            <a href="/compras" class="modulo">COMPRAS</a>
            <a href="/inventarios" class="modulo">INVENTARIOS</a>
            <!--<a href="/calidad/registro" class="modulo">CALIDAD</a>-->
        {% endif %}
    </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
